[workspace]
members = [
    "core",
    "backend",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Source Translator Contributors"]
license = "MIT"
repository = "https://github.com/source-translator/source-translator"
description = "Free, cache-first translation API and SDK"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "=0.7.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.2", features = ["runtime-tokio", "postgres", "uuid"] }
redis = { version = "=0.26.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1"
urlencoding = "2"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
chrono = { version = "0.4", features = ["serde"] }
